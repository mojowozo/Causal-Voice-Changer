[project]
name = "causalvc"
version = "0.1.0"
description = "Causal streaming voice changer (causalvc) and its evaluation harness (vcbench)"
requires-python = ">=3.12,<3.13"
# What building and running a voice needs. The harness and its metric models are the "bench" extra.
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
    "librosa",
    "sounddevice",
    "pyrnnoise",
]

[project.optional-dependencies]
bench = [
    "transformers",
    "scipy",
    "soxr",
    "jiwer",
    "torchcrepe",
    "pandas",
    "tqdm",
    "pyyaml",
    "tabulate",
]

[project.scripts]
vcbench = "vcbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vcbench", "causalvc"]

# On Windows the PyPI build of torch has no GPU support, so take the CUDA build from PyTorch's own index there.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# pyrnnoise is used only for the RNNoise library it ships (realtime/tools/rnnoise.py loads it
# directly); its own Python layer, and the plotting and audio packages that layer needs, are not.
[[tool.uv.dependency-metadata]]
name = "pyrnnoise"
requires-dist = []
