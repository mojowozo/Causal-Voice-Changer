[project]
name = "causalvc"
version = "0.1.1"
description = "Causal streaming voice changer (causalvc) and its evaluation harness (vcbench)"
requires-python = ">=3.12,<3.13"
# What building and running a voice needs. The harness and its metric models are the "bench" extra.
dependencies = [
    # On Windows, torch comes from the "cuda" (NVIDIA) or "rocm" (AMD) extra instead; see below.
    "torch; sys_platform != 'win32'",
    "torchaudio; sys_platform != 'win32'",
    "numpy",
    "soundfile",
    "librosa",
    "sounddevice",
    "pyrnnoise",
    # Runs Hushwire's noise-suppression model (Amazon Voice Focus, a WebAssembly module).
    "wasmtime",
]

[project.optional-dependencies]
# Windows GPU builds of PyTorch; run-realtime.bat and run-training.bat pick one by GPU vendor.
cuda = [
    "torch; sys_platform == 'win32'",
    "torchaudio; sys_platform == 'win32'",
]
# AMD's own Windows build (ROCm 7.2.1): Radeon RX 7000/9000 and Ryzen AI Max/300, driver 26.2.2 or newer.
rocm = [
    "torch==2.9.1+rocm7.2.1; sys_platform == 'win32'",
    "torchaudio==2.9.1+rocm7.2.1; sys_platform == 'win32'",
    # The ROCm runtime torch loads; listed here so it is taken from AMD's index too.
    "rocm[libraries]==7.2.1; sys_platform == 'win32'",
    "rocm-sdk-core==7.2.1; sys_platform == 'win32'",
    "rocm-sdk-libraries-custom==7.2.1; sys_platform == 'win32'",
]
# AMD's newer nightly build (TheRock) for the Radeon RX 6000 series, which the build above does not
# support: one GPU package per chip, all four included so any RX 6000 works (gfx1030: 6800/6900,
# gfx1031: 6700/6750, gfx1032: 6600/6650, gfx1034: 6500/6400; about 110 MB each).
rocm-rdna2 = [
    "torch[device-gfx1030,device-gfx1031,device-gfx1032,device-gfx1034]>=2.16.0a0; sys_platform == 'win32'",
    "torchaudio>=2.11.1; sys_platform == 'win32'",
    # The ROCm runtime and GPU packages torch pins; listed so they are taken from AMD's nightly index too.
    "rocm[libraries]; sys_platform == 'win32'",
    "rocm-sdk-core; sys_platform == 'win32'",
    "rocm-sdk-libraries; sys_platform == 'win32'",
    "rocm-bootstrap; sys_platform == 'win32'",
    "amd-torch-device-gfx1030; sys_platform == 'win32'",
    "amd-torch-device-gfx1031; sys_platform == 'win32'",
    "amd-torch-device-gfx1032; sys_platform == 'win32'",
    "amd-torch-device-gfx1034; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1030; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1031; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1032; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1034; sys_platform == 'win32'",
]
bench = [
    "transformers",
    "scipy",
    "soxr",
    "jiwer",
    "torchcrepe",
    "pandas",
    "tqdm",
    "pyyaml",
    "tabulate",
]

[project.scripts]
vcbench = "vcbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vcbench", "causalvc"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }, { extra = "rocm-rdna2" }]]

# On Windows the PyPI build of torch has no GPU support: the CUDA build comes from PyTorch's own
# index, the ROCm build (and the ROCm runtime packages it pulls in) from AMD's.
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'", extra = "cuda" },
    { index = "rocm-windows", marker = "sys_platform == 'win32'", extra = "rocm" },
    { index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" },
]
torchaudio = [
    { index = "rocm-windows", marker = "sys_platform == 'win32'", extra = "rocm" },
    { index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" },
]
rocm = [
    { index = "rocm-windows", marker = "sys_platform == 'win32'", extra = "rocm" },
    { index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" },
]
rocm-sdk-core = [
    { index = "rocm-windows", marker = "sys_platform == 'win32'", extra = "rocm" },
    { index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" },
]
rocm-sdk-libraries-custom = [{ index = "rocm-windows", marker = "sys_platform == 'win32'", extra = "rocm" }]
# The nightly build's own packages, found only on AMD's nightly index.
rocm-sdk-libraries = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
rocm-bootstrap = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
amd-torch-device-gfx1030 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
amd-torch-device-gfx1031 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
amd-torch-device-gfx1032 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
amd-torch-device-gfx1034 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
rocm-sdk-device-gfx1030 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
rocm-sdk-device-gfx1031 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
rocm-sdk-device-gfx1032 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]
rocm-sdk-device-gfx1034 = [{ index = "rocm-nightly", marker = "sys_platform == 'win32'", extra = "rocm-rdna2" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "rocm-windows"
url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/"
format = "flat"
explicit = true

# AMD's nightly index (TheRock), for the rocm-rdna2 extra.
[[tool.uv.index]]
name = "rocm-nightly"
url = "https://nightly.repo.amd.com/rocm/whl-next/"
explicit = true

# pyrnnoise is used only for the RNNoise library it ships (realtime/tools/rnnoise.py loads it
# directly); its own Python layer, and the plotting and audio packages that layer needs, are not.
[[tool.uv.dependency-metadata]]
name = "pyrnnoise"
requires-dist = []
